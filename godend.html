<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gracias por quedarte</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:'Segoe UI', system-ui;
  color:#f5e6d3;

  background-image:url("assets/fondogodend3.jpg");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

/* Oscurecer fondo */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(10,8,20,.75);
  z-index:0;
}

audio{ display:none; }

/* CONTENEDOR */
.container{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  z-index:2;
  padding:20px;
}

/* ANIMACIONES GENERALES */
.fade{
  opacity:0;
  transform:translateY(20px);
  animation:fadeIn 2s ease forwards;
}

.delay-1{ animation-delay:1s }
.delay-2{ animation-delay:2.5s }
.delay-3{ animation-delay:4.5s }

@keyframes fadeIn{
  to{
    opacity:1;
    transform:none;
  }
}

h1{
  font-size:46px;
  margin-bottom:15px;
}

p{
  max-width:620px;
  font-size:20px;
  line-height:1.7;
  opacity:.95;
}

/* SLIDER */
.slider{
  margin-top:40px;
  max-width:340px;
  width:90%;
  max-height:55vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.slide{
  display:none;
  width:100%;
  height:100%;
  justify-content:center;
  align-items:center;
}

.slide.active{
  display:flex;
}

.slide img{
  max-width:100%;
  max-height:55vh;
  width:auto;
  height:auto;
  object-fit:contain;
  border-radius:18px;
  box-shadow:0 0 45px rgba(255,180,220,.35);
  animation:zoom 12s ease-in-out infinite;
}

@keyframes zoom{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}

/* ESTRELLAS */
canvas{
  position:fixed;
  inset:0;
  z-index:1;
}
</style>
</head>

<body>

<!-- 🎵 Música -->
<audio id="music" autoplay muted loop>
  <source src="assets/godned.flac" type="audio/mpeg">
</audio>

<canvas id="stars"></canvas>

<div class="container">
  <h1 class="fade delay-1">Gracias por quedarte</h1>

  <p class="fade delay-2">
    Gracias por elegir seguir conmigo.<br>
    No porque fuera perfecto,<br>
    sino porque fue sincero.<br><br>
    Esto no es una promesa eterna,<br>
    es un presente compartido.<br>
    <small>(por ahora son pocas fotos, pero este lugar seguirá creciendo)</small>
  </p>

  <div class="slider fade delay-3">
    <div class="slide active"><img src="assets/foto1.jpeg"></div>
    <div class="slide"><img src="assets/foto2.jpeg"></div>
    <div class="slide"><img src="assets/foto3.jpeg"></div>
    <div class="slide"><img src="assets/foto4.jpeg"></div>
    <div class="slide"><img src="assets/foto5.jpeg"></div>
    <div class="slide"><img src="assets/foto6.jpeg"></div>
  </div>
</div>

<script>
/* 🎵 AUDIO – intento de autoplay real */
const music = document.getElementById('music');

window.addEventListener('load',()=>{
  setTimeout(()=>{
    music.muted = false;
    music.play().catch(()=>{});
  },1200);
});

/* SLIDES */
const slides = document.querySelectorAll('.slide');
let index = 0;

setInterval(()=>{
  slides[index].classList.remove('active');
  index = (index + 1) % slides.length;
  slides[index].classList.add('active');
}, 4500);

/* ESTRELLAS */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let w,h,stars=[];

function resize(){
  w = canvas.width = innerWidth;
  h = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);

for(let i=0;i<180;i++){
  stars.push({
    x:Math.random()*w,
    y:Math.random()*h,
    r:Math.random()*1.6,
    v:Math.random()*0.5+0.2
  });
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='rgba(255,255,255,.8)';
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
    s.y+=s.v;
    if(s.y>h) s.y=0;
  });
  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
