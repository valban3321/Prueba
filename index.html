<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi novia?</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100svh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:system-ui;
    background:
        radial-gradient(rgba(0,0,40,.45), rgba(0,0,40,.85)),
        url("assets/fondoindex.gif") center/cover no-repeat fixed;
    overflow:hidden;
}

/* ===== PARTÍCULAS VAN GOGH ===== */
.particles span{
    position:absolute;
    bottom:-10%;
    font-size:18px;
    opacity:.75;
    animation:floatStar linear infinite;
    pointer-events:none;
    filter:drop-shadow(0 0 6px rgba(255,255,200,.6));
}

@keyframes floatStar{
    from{
        transform:translateY(0) rotate(0deg) scale(.8);
        opacity:0;
    }
    20%{opacity:1}
    to{
        transform:translateY(-120vh) rotate(360deg) scale(1.2);
        opacity:0;
    }
}

/* ===== CARD ===== */
.card{
    background:rgba(128, 102, 223, 0.94);
    padding:22px;
    border-radius:20px;
    text-align:center;
    max-width:380px;
    box-shadow:
        0 20px 40px rgba(0,0,0,.45),
        0 0 30px rgba(120,170,255,.25);
    z-index:2;
}

.card p{
    margin-bottom:10px;
}

h2{
    margin:10px 0 18px;
}

/* ===== BOTONES ===== */
.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
}

button{
    padding:14px 22px;
    border:none;
    border-radius:14px;
    font-size:16px;
    cursor:pointer;
    transition:.3s ease;
}

#yesBtn{
    background:#38b000;
    color:white;
}

#noBtn{
    background:#e63946;
    color:white;
}

#msg{
    margin-top:14px;
    min-height:20px;
}
</style>
</head>

<body>

<!-- 🌌 Partículas -->
<div class="particles"></div>

<div class="card">
    <p>Este libro habla de procesos, rupturas y constancia,<br>yo quiero intentar un proceso contigo.</p>
    <h2>¿Quieres ser mi novia?</h2>

    <div class="buttons">
        <button id="yesBtn">Sí 💕</button>
        <button id="noBtn">No 😅</button>
    </div>

    <p id="msg"></p>
</div>

<script>
/* ===== PARTÍCULAS ===== */
const particles = document.querySelector(".particles");
const symbols = ["✨","🌟","💫","⭐"];

function createParticle(){
    const span = document.createElement("span");
    span.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    span.style.left = Math.random()*100 + "vw";
    span.style.fontSize = 14 + Math.random()*18 + "px";
    span.style.animationDuration = 12 + Math.random()*10 + "s";
    particles.appendChild(span);

    setTimeout(()=>span.remove(),22000);
}

setInterval(createParticle,500);

/* ===== LÓGICA ORIGINAL ===== */
let noCount = 0;

const yesBtn = document.getElementById("yesBtn");
const noBtn  = document.getElementById("noBtn");
const msg    = document.getElementById("msg");

noBtn.onclick = () => {
    noCount++;

    if (noCount >= 8) {
        window.location.href = "rechazado.html";
        return;
    }

    yesBtn.style.fontSize = (16 + noCount * 2) + "px";

    msg.textContent = [
        "¿Segura? 😌",
        "Chance y te estás equivocando de botón 🤭",
        "Échale una pensada 💕",
        "Que este no es 😅",
        "¿Estás segura que es lo que quieres?",
        "Bien segura? 👀",
        "Neta? 😳",
        "…"
    ][noCount];
};

yesBtn.onclick = () => {
    window.location.href = "tree.html";
};
</script>

</body>
</html>
