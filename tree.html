<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxia</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#ffffff;
  font-family: system-ui;
}

canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

.ui{
  position:absolute;
  top:100px;
  left:50%;
  transform:translateX(-50%);
  z-index:5;
  text-align:center;
  color:#fff;
}

/* FILA HORIZONTAL */
.info-row{
  margin-top:20px;
  display:flex;
  gap:18px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}

h1{
  font-size:2.2rem;
  text-shadow:0 0 20px rgba(150,15,15,.4);
}

.timer{
  margin-top:330px;
  padding:14px 26px;
  border-radius:22px;
  background:rgba(41,27,27,.65);
  display:inline-block;
  box-shadow:0 0 30px rgba(2,78,255,.25);
}

/* BOTÓN */
.message{
  margin-top:5px;
  padding:16px 30px;
  border-radius:30px;
  background:linear-gradient(135deg,#7b5cff,#ff5db1);
  display:inline-block;
  font-weight:600;
  box-shadow:0 0 40px rgba(255,100,200,.45);
  border:none;
  color:white;
  cursor:pointer;
  pointer-events:auto;
}
</style>
</head>

<body>

<canvas id="galaxy"></canvas>

<!-- 🎵 MÚSICA -->
<audio id="music" loop>
  <source src="assets/My feelings.mp3" type="audio/mpeg">
</audio>

<div class="ui">
  <h1>Desde nuestra primera cita han pasado:</h1>

  <div class="info-row">
    <div class="timer" id="timer"></div>
    <button class="message" onclick="window.location.href='galaxy.html'">
      Una galaxia no alcanza para decirte lo que siento
    </button>
  </div>
</div>

<script>
/* =====================
   MÚSICA AUTOMÁTICA
===================== */
const music = document.getElementById("music");
music.volume = 0.6;

function startMusic(){
  music.play().catch(()=>{});
}
window.addEventListener("load", startMusic);
document.body.addEventListener("click", startMusic, { once:true });

/* =====================
   CANVAS SETUP
===================== */
const canvas = document.getElementById("galaxy");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* =====================
   TIMER
===================== */
const startDate = new Date("2025-09-20T15:00:00");

function updateTimer(){
  const now = new Date();
  let diff = Math.floor((now - startDate)/1000);

  const d = Math.floor(diff/86400); diff%=86400;
  const h = Math.floor(diff/3600); diff%=3600;
  const m = Math.floor(diff/60);
  const s = diff%60;

  document.getElementById("timer").textContent =
    `${d} días, ${h} horas, ${m} minutos y ${s} segundos`;
}
setInterval(updateTimer,1000);
updateTimer();

/* =====================
   PINCELADAS GALÁCTICAS
===================== */
const strokes=[];
for(let i=0;i<600;i++){
  strokes.push({
    angle:Math.random()*Math.PI*8,
    radius:80+Math.random()*420,
    speed:0.001+Math.random()*0.004,
    size:2+Math.random()*4,
    hue:200+Math.random()*80
  });
}

/* =====================
   ESTRELLAS INTERACTIVAS
===================== */
let stars=[];

function spawnStars(x,y){
  for(let i=0;i<10;i++){
    stars.push({
      x,y,
      vx:(Math.random()-0.5)*6,
      vy:(Math.random()-0.5)*6,
      life:80
    });
  }
}

addEventListener("mousemove",e=>{
  spawnStars(e.clientX,e.clientY);
});

addEventListener("touchstart",e=>{
  const t=e.touches[0];
  spawnStars(t.clientX,t.clientY);
});

/* =====================
   FORMA DE ESTRELLA
===================== */
const starShape=[];
for(let i=0;i<200;i++){
  const a=i/200*Math.PI*2;
  const r=i%2===0?180:90;
  starShape.push({a,r});
}

/* =====================
   DRAW LOOP
===================== */
function draw(){
  ctx.fillStyle="rgba(5,10,25,.22)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const cx=canvas.width/2;
  const cy=canvas.height/2;

  strokes.forEach(s=>{
    s.angle+=s.speed;
    const x=cx+Math.cos(s.angle)*s.radius;
    const y=cy+Math.sin(s.angle)*s.radius;

    ctx.beginPath();
    ctx.strokeStyle=`hsla(${s.hue},80%,70%,.6)`;
    ctx.lineWidth=s.size;
    ctx.shadowBlur=20;
    ctx.shadowColor=ctx.strokeStyle;
    ctx.moveTo(x,y);
    ctx.lineTo(x+Math.cos(s.angle)*14,y+Math.sin(s.angle)*14);
    ctx.stroke();
  });

  ctx.beginPath();
  starShape.forEach((p,i)=>{
    const x=cx+Math.cos(p.a)*p.r;
    const y=cy+Math.sin(p.a)*p.r;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.strokeStyle="rgba(255,255,255,.45)";
  ctx.lineWidth=2;
  ctx.shadowBlur=30;
  ctx.stroke();

  stars=stars.filter(s=>s.life>0);
  stars.forEach(s=>{
    s.x+=s.vx;
    s.y+=s.vy;
    s.life--;
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(s.x,s.y,2.2,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
